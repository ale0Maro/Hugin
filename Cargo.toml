[workspace]
resolver = "3"
members = ["kernel"

]

exclude = [

]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alessio Maroni"]
license = "MIT or Apache-2.0"
readme = "README"
repository = "https://github.com/ale0Maro/Hermit"

[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true 
debug-assertions = true
lto = false
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
strip = "symbols"
